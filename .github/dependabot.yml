version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    pull-request-branch-name:
      separator: "-"
  # The Dockerfiles live in subdirectories; "/" matched nothing, so base images
  # were never proposed for update.
  - package-ecosystem: "docker"
    directories:
      - "/ui"
      - "/function"
    schedule:
      interval: "weekly"
    pull-request-branch-name:
      separator: "-"
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    pull-request-branch-name:
      separator: "-"
