kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1beta1
metadata:
  name: tika-ui
spec:
  parentRefs:
  - kind: Gateway
    name: external-gw
    namespace: gateway-ingress
    sectionName: https
  rules:
  # OCR on a scanned PDF runs for minutes, well past the 15s most gateways
  # default to. Matches the nginx overlay so both routes behave the same.
  - timeouts:
      request: 3600s
      backendRequest: 3600s
    matches:
    - path:
        value: /
    backendRefs:
    - name: tika-ui
      port: 8080
